name: Trucking news

on:
  schedule:
    - cron: "0 */3 * * *"   # update the web page every 3 hours
    - cron: "0 13 * * *"    # daily email digest (13:00 UTC = 6:00 AM Pacific in summer)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser

      - run: python trucking_news_digest.py
        env:
          SEND_EMAIL: ${{ github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add history.json docs/index.html
          git diff --cached --quiet || (git commit -m "Update news" && git push)
